<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shannon-b1 · 开源LLM项目</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, 'Segoe UI', 'Roboto', 'Helvetica Neue', sans-serif;
            background: #f8f8fc;
            color: #1a1a2a;
            line-height: 1.5;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* 顶部导航栏 */
        .navbar {
            background: #ffffff;
            border-bottom: 1px solid #eaeaef;
            padding: 16px 32px;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(8px);
            background: rgba(255, 255, 255, 0.92);
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
        }

        .logo {
            font-weight: 700;
            font-size: 1.35rem;
            letter-spacing: -0.3px;
            background: linear-gradient(135deg, #2d2d44, #4a4a6a);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }

        .nav-links {
            display: flex;
            gap: 28px;
            align-items: center;
            flex-wrap: wrap;
        }

        .nav-links a {
            text-decoration: none;
            color: #4a4a5a;
            font-weight: 500;
            transition: color 0.2s;
            font-size: 0.9rem;
        }

        .nav-links a:hover {
            color: #2c2c4e;
        }

        /* 主内容区 - 弹性撑开页脚 */
        .main-content {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 48px 24px;
        }

        /* 简约卡片 */
        .card {
            max-width: 620px;
            width: 100%;
            background: #ffffff;
            border-radius: 36px;
            padding: 48px 36px;
            text-align: center;
            box-shadow: 0 12px 28px -8px rgba(0, 0, 0, 0.06);
            border: 1px solid #ececf0;
        }

        .status-badge {
            display: inline-block;
            background: #f0f0f3;
            padding: 6px 18px;
            border-radius: 60px;
            font-size: 0.8rem;
            font-weight: 500;
            color: #5a5a6e;
            margin-bottom: 28px;
        }

        h1 {
            font-size: 3rem;
            font-weight: 650;
            letter-spacing: -0.01em;
            color: #181826;
            margin-bottom: 12px;
        }

        .subtitle {
            font-size: 1rem;
            color: #6c6c7e;
            margin-bottom: 32px;
            font-weight: 400;
        }

        .dev-notice {
            background: #f8f8fc;
            border-radius: 28px;
            padding: 24px 20px;
            margin: 24px 0 28px;
            border: 1px solid #eaeaef;
        }

        .dev-notice p {
            color: #4a4a5e;
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .repo-container {
            background: #f8f8fc;
            border-radius: 60px;
            padding: 10px 18px;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
            margin: 16px 0 20px;
            border: 1px solid #eaeaef;
        }

        .repo-label {
            font-weight: 500;
            color: #5a5a6e;
            font-size: 0.85rem;
        }

        .repo-url {
            font-family: 'SF Mono', 'Fira Code', monospace;
            font-size: 0.85rem;
            font-weight: 500;
            background: #ffffff;
            padding: 6px 16px;
            border-radius: 48px;
            color: #3a3a4a;
            text-decoration: none;
            border: 1px solid #dddde3;
            word-break: break-all;
            transition: background 0.2s;
        }

        .repo-url:hover {
            background: #eeedf5;
            border-color: #b9b9cc;
        }

        .btn-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #eaeaef;
            color: #2c2c3a;
            text-decoration: none;
            padding: 10px 28px;
            border-radius: 48px;
            font-weight: 500;
            font-size: 0.9rem;
            transition: 0.2s;
            margin-top: 8px;
        }

        .btn-link:hover {
            background: #dedee6;
        }

        /* 页脚样式 - 简化协议显示 */
        .footer {
            background: #fefefe;
            border-top: 1px solid #eaeaef;
            padding: 32px 24px 40px;
            margin-top: auto;
        }

        .footer-container {
            max-width: 1000px;
            margin: 0 auto;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            gap: 32px;
            align-items: flex-start;
        }

        .footer-section {
            flex: 1;
            min-width: 180px;
        }

        .footer-section h4 {
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #5c5c72;
            margin-bottom: 16px;
        }

        .footer-section p, .footer-section a {
            font-size: 0.8rem;
            color: #6c6c82;
            text-decoration: none;
            line-height: 1.6;
            display: block;
            margin-bottom: 8px;
        }

        .footer-section a:hover {
            color: #2d2d4a;
            text-decoration: underline;
        }

        /* 简化开源协议显示 */
        .license-simple {
            background: #f4f4f9;
            padding: 10px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            color: #4a4a60;
            border: 1px solid #e2e2e8;
            font-family: monospace;
            display: inline-block;
        }

        .copyright {
            text-align: center;
            margin-top: 32px;
            padding-top: 24px;
            border-top: 1px solid #ececf0;
            font-size: 0.7rem;
            color: #7a7a8c;
        }

        @media (max-width: 680px) {
            .navbar {
                padding: 12px 20px;
            }
            .nav-container {
                flex-direction: column;
                align-items: center;
            }
            .card {
                padding: 32px 20px;
            }
            h1 {
                font-size: 2.3rem;
            }
            .footer-container {
                flex-direction: column;
                gap: 24px;
            }
            .footer-section {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <!-- 顶部导航栏 -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">Shannon‑b1</div>
            <div class="nav-links">
                <!-- 项目链接改为指定地址 -->
                <a href="https://repo.xuefengpeng.com/Shannon-b1" target="_blank" rel="noopener noreferrer">项目</a>
                <a href="https://github.com/Oringes9235/Shannon-b1" target="_blank" rel="noopener noreferrer">GitHub</a>
                <a href="#license">开源协议</a>
                <a href="#about">关于</a>
            </div>
        </div>
    </nav>

    <!-- 主体内容区域 -->
    <div class="main-content" id="home">
        <div class="card">
            <div class="status-badge">
                🚧 开发中
            </div>
            <h1>Shannon‑b1</h1>
            <div class="subtitle">
                大型语言模型 · 开源项目
            </div>

            <!-- 开发中说明 -->
            <div class="dev-notice">
                <p>
                    该模型目前正在开发中，尚未发布正式版本。<br>
                    代码、权重与相关文档将逐步开放。
                </p>
            </div>

            <!-- 仓库地址展示 -->
            <div class="repo-container">
                <span class="repo-label">📁 仓库地址</span>
                <a href="https://github.com/Oringes9235/Shannon-b1" target="_blank" rel="noopener noreferrer" class="repo-url">
                    github.com/Oringes9235/Shannon-b1
                </a>
            </div>

            <!-- 访问仓库按钮 -->
            <a href="https://github.com/Oringes9235/Shannon-b1" target="_blank" rel="noopener noreferrer" class="btn-link">
                <span>🔗</span> 访问 GitHub 仓库
            </a>
        </div>
    </div>

    <!-- 页脚区域：简化开源协议显示，移除问题反馈和贡献指南链接 -->
    <footer class="footer" id="license">
        <div class="footer-container">
            <div class="footer-section">
                <h4>📄 开源协议</h4>
                <div class="license-simple">
                    MIT License
                </div>
            </div>
            <div class="footer-section">
                <h4>🔗 项目链接</h4>
                <a href="https://github.com/Oringes9235/Shannon-b1" target="_blank" rel="noopener noreferrer">GitHub 仓库</a>
                <a href="https://repo.xuefengpeng.com/Shannon-b1" target="_blank" rel="noopener noreferrer">项目站点</a>
            </div>
            <div class="footer-section">
                <h4>📌 鸣谢</h4>
                <p>感谢所有开源社区贡献者</p>
                <p>项目持续迭代中</p>
            </div>
        </div>
        <div class="copyright">
            <!-- 版权信息已修改 -->
            <span>© 2025 oringes.cn</span>
        </div>
    </footer>

    <!-- 简单脚本：外链安全 + 平滑滚动导航 -->
    <script>
        (function() {
            // 所有外链增加安全属性
            const externalLinks = document.querySelectorAll('a[target="_blank"]');
            externalLinks.forEach(link => {
                link.setAttribute('rel', 'noopener noreferrer');
            });

            // 顶部导航栏内锚点平滑滚动（指向 id 为 home / license / about）
            const navAnchors = document.querySelectorAll('.nav-links a');
            navAnchors.forEach(anchor => {
                anchor.addEventListener('click', function(e) {
                    const href = this.getAttribute('href');
                    if (href && href.startsWith('#')) {
                        const targetId = href.substring(1);
                        const targetElement = document.getElementById(targetId);
                        if (targetElement) {
                            e.preventDefault();
                            targetElement.scrollIntoView({
                                behavior: 'smooth',
                                block: 'start'
                            });
                        }
                    }
                });
            });
        })();
    </script>
</body>
</html>
